# Netlify site for the amarantha.app live demo (@amarantha/web).
#
# Effective base stays at the repo root (not packages/web) because
# @amarantha/web depends on sibling workspace packages
# (core/editor/mdx/source/theme) via npm workspaces symlinks + Vite path
# aliases pointing at their raw src/ — there is no publish/build step for
# those packages. Installing from packages/web alone would leave those
# workspace links unresolved.
#
# Deliberately no `base = "."` here: Netlify always reads the repo-root
# netlify.toml first, and an explicit `base` in it overrides every site's
# own dashboard "Base directory" setting — that broke the separate
# docs.amarantha.app site (@amarantha/docs), whose dashboard sets Base
# directory to `packages/docs` so it reads packages/docs/netlify.toml
# instead of this file. Root (".") is the default when unset anyway, so
# omitting it changes nothing for this site.
[build]
  command = "npm ci && npm run build --workspace @amarantha/web"
  publish = "packages/web/dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
